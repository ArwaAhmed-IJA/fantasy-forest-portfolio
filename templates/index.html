<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ owner.name }} — Fantasy Forest Portfolio</title>
  <meta name="description" content="Interactive Fantasy Forest Portfolio of {{ owner.name }}, {{ owner.title }}." />
  <link rel="stylesheet" href="static/css/door.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Skip link for keyboard / screen-reader accessibility -->
  <a href="library.html" class="skip-link">Skip intro — enter the library</a>

  <!-- Top bar: Elegant Brand Header -->
  <header class="top-nav" aria-label="Scene navigation">
    <div class="brand">
      <span class="brand-name">{{ owner.name }}</span>
      <span class="brand-dot">•</span>
      <span class="brand-title">{{ owner.title }}</span>
    </div>
    <div class="top-nav-right">
      <a href="library.html" class="nav-explore-btn">Enter Library &#8594;</a>
    </div>
  </header>

  <!-- Main Scene Panorama (Fills 100vw x 100vh with no dark bars) -->
  <div class="scene" id="scene" aria-label="Fantasy forest entrance door">

    <!-- High-Resolution Enchanted Forest Panorama (Swan lake, Wisteria door, Sunlit staircase) -->
    <div class="scene-artwork" id="sceneArtwork" aria-hidden="true"></div>

    <!-- Living Animated Swan on the Enchanted Lake -->
    <div class="swan-lake-unit" id="swanLakeUnit" aria-hidden="true">
      <div class="swan-anchor">
        <div class="swan-ripple r1"></div>
        <div class="swan-ripple r2"></div>
        <div class="swan-ripple r3"></div>
        <div class="swan-drifter">
          <div class="swan-sprite"></div>
        </div>
      </div>
    </div>

    <!-- Atmospheric god-rays & magical twilight haze -->
    <div class="sunbeam-overlay" aria-hidden="true"></div>

    <!-- 3D Interactive Door Unit (Positioned right over the arched door) -->
    <div class="door-unit" id="doorUnit" aria-hidden="true">
      <!-- Golden Interior Light (Illuminates when door swings open) -->
      <div class="door-interior" id="doorInterior">
        <div class="interior-warmth"></div>
        <div class="interior-rays"></div>
      </div>

      <!-- 3D Door Leaf (Swings open inward) -->
      <div class="door-leaf" id="doorLeaf">
        <div class="leaf-front" id="leafFront"></div>
        <div class="leaf-edge"></div>
      </div>
    </div>

    <!-- Interactive Click/Focus Enter Button overlaying the door -->
    <button
      class="door-enter-trigger"
      id="enterBtn"
      aria-label="Open portfolio door — enter the fantasy library"
      tabindex="0"
    >
      <span class="rune-pulse" aria-hidden="true"></span>

      <!-- Visually Appealing Floating Fantasy Arrow (No circle) -->
      <div class="door-pointer-guide" aria-hidden="true">
        <svg class="fantasy-arrow-svg" width="34" height="46" viewBox="0 0 34 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fantasyGoldGrad" x1="17" y1="0" x2="17" y2="46" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fff8db" />
              <stop offset="40%" stop-color="#f5d378" />
              <stop offset="100%" stop-color="#c6922e" />
            </linearGradient>
            <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
              <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f5d378" flood-opacity="0.9" />
              <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ffb703" flood-opacity="0.5" />
            </filter>
          </defs>
          <!-- Elegant Top Diamond Accent -->
          <polygon points="17,1 20.5,5.5 17,10 13.5,5.5" fill="url(#fantasyGoldGrad)" filter="url(#goldGlow)" />
          <!-- Sleek Center Shaft -->
          <path d="M17 9.5 V30" stroke="url(#fantasyGoldGrad)" stroke-width="2.8" stroke-linecap="round" filter="url(#goldGlow)" />
          <!-- Graceful Flared Arrowhead -->
          <path d="M5.5 21 L17 35.5 L28.5 21" stroke="url(#fantasyGoldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
          <!-- Inner Secondary Shimmer Chevron -->
          <path d="M9.5 26.5 L17 35.5 L24.5 26.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
          <!-- Trailing Starlight Dot -->
          <circle cx="17" cy="41" r="1.5" fill="#fff9e6" filter="url(#goldGlow)" />
        </svg>
      </div>

      <span class="enter-prompt" aria-hidden="true">
        <span class="prompt-icon">✧</span>
        <span class="prompt-text">Click Door to Enter</span>
        <span class="prompt-icon">✧</span>
      </span>
    </button>

    <!-- Ambient Floating Fireflies & Wisteria Petals -->
    <div class="particles" aria-hidden="true" id="particles"></div>

    <!-- Full-screen warm light flood on door open -->
    <div class="light-flood" id="lightFlood" aria-hidden="true"></div>

  </div><!-- /.scene -->

  <script src="static/js/door.js"></script>
</body>
</html>
